[package]
name = "json-tools"
version = "0.1.0"
edition = "2021"
description = "A JSON swiss-army knife CLI: fmt, validate, flatten/unflatten, get, keys, diff, merge"
license = "MIT"
authors = ["smolkai <smolkai@users.noreply.github.com>"]
repository = ""

[[bin]]
name = "json-tools"
path = "src/main.rs"

[lib]
name = "json_tools"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
